; ESAVE - Room 206 controller firmware
; Board: ESP32-WROOM-32 (classic ESP32: Bluetooth Classic SPP is required).
;
;   pio run                        build the default environment
;   pio run -t upload              build and flash
;   pio device monitor             serial log (115200, with crash decoding)
;
; Copy include/secrets.example.h to include/secrets.h first (git-ignored).

[platformio]
default_envs = esp32dev

[env]
board = esp32dev
framework = arduino
; Bluetooth Classic + Wi-Fi + verified TLS is ~1.8 MB: needs the 3 MB app partition.
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    ; 1.2.1 is not in the PlatformIO registry (latest there is 1.1.2), so pin the GitHub tag.
    https://github.com/mandulaj/PZEM-004T-v30.git#v1.2.1
    marcoschwartz/LiquidCrystal_I2C @ 1.1.4

; Recommended: Arduino-ESP32 core 3.3.11, the version this firmware is verified on, via the
; pioarduino platform (the official PlatformIO platform stops at core 2.x). First build
; downloads the core and toolchain (several GB unpacked).
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; mbedTLS allocates its record buffers per record instead of holding two ~16.7 KB buffers per
; session, so Bluetooth Classic and Firebase TLS fit in the heap together (BT_CLOUD_COEXIST in
; config.h). Changing the sdkconfig rebuilds the ESP-IDF libraries ("hybrid compile"): the first
; build takes much longer.
custom_sdkconfig =
    CONFIG_MBEDTLS_DYNAMIC_BUFFER=y

; Fallback: official PlatformIO platform with Arduino-ESP32 core 2.0.16 (smaller download;
; core 2.x is end-of-life). Build with: pio run -e esp32dev-core2
[env:esp32dev-core2]
platform = espressif32 @ 6.7.0
upload_speed = 115200
